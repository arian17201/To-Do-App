
<!-- frontend/index.php -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        form { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; }
        button { padding: 10px 15px; border: none; background: #333; color: #fff; cursor: pointer; }
        button:hover { background: #555; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #eee; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Todo List</h1>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Add a new task..." required>
            <button type="submit">Add Task</button>
        </form>
        <ul id="task-list">
            <!-- Tasks will be loaded here by JavaScript -->
        </ul>
    </div>

    <script>
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');

        // The URL for the backend API. Docker Compose will let us use the service name 'backend'.
        const apiUrl = 'http://localhost:3000/tasks';

        // Function to fetch and display tasks
        async function getTasks() {
            try {
                const response = await fetch(apiUrl);
                const tasks = await response.json();
                
                // Clear the list before rendering
                taskList.innerHTML = ''; 

                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.textContent = task.task;
                    taskList.appendChild(li);
                });
            } catch (error) {
                console.error('Failed to fetch tasks:', error);
                taskList.innerHTML = '<li>Error loading tasks. Is the backend running?</li>';
            }
        }

        // Function to add a new task
        async function addTask(event) {
            event.preventDefault();
            const taskText = taskInput.value.trim();

            if (!taskText) return;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ task: taskText }),
                });

                if (response.ok) {
                    taskInput.value = ''; // Clear input field
                    getTasks(); // Refresh the list
                } else {
                    console.error('Failed to add task');
                }
            } catch (error) {
                console.error('Error adding task:', error);
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', getTasks);
        taskForm.addEventListener('submit', addTask);
    </script>

</body>
</html>
